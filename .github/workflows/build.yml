name: NetSurf Kindle build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'build.sh', '.github/workflows/build.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Előre elkészített Kindle hard-float fordítókörnyezet (2024-es Paperwhite).
    # Így nem kell a toolchaint építeni (azt a lépést akadt el a config.guess letöltés).
    container:
      image: ghcr.io/koreader/koxtoolchain:kindlehf-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hiányzó eszközök (ha kellenek)
        shell: bash
        run: |
          # az image már tartalmazza a fordítót; a NetSurf-hez kellhet még pár apróság
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update || true
            apt-get install -y --no-install-recommends git file pkg-config python3 unzip wget curl rsync ca-certificates || true
          fi

      - name: Fordító megkeresése (PATH + tuple)
        id: tc
        shell: bash
        run: |
          set -e
          GCC="$(find / -name '*kindlehf*-gcc' -type f 2>/dev/null | head -n1)"
          if [ -z "$GCC" ]; then
            GCC="$(find / -name 'arm-*-linux-gnueabihf-gcc' -type f 2>/dev/null | head -n1)"
          fi
          test -n "$GCC"   # ha itt elhasal, a konténer-címke rossz – írd meg a naplót
          BINDIR="$(dirname "$GCC")"
          TUPLE="$(basename "$GCC" | sed 's/-gcc$//')"
          echo "Fordító: $GCC"
          echo "Tuple:   $TUPLE"
          echo "$BINDIR" >> "$GITHUB_PATH"
          echo "tuple=$TUPLE" >> "$GITHUB_OUTPUT"

      - name: NetSurf fordítása
        shell: bash
        run: |
          chmod +x build.sh
          TARGET_TUPLE="${{ steps.tc.outputs.tuple }}" JOBS="$(nproc)" ./build.sh

      - name: Eredmény feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: netsurf-kindle
          path: |
            out/netsurf
            out/fbink
            out/res/**
          if-no-files-found: error
