name: NetSurf Kindle build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'build.sh', '.github/workflows/build.yml' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KOX_TARGET: kindlehf
    steps:
      - uses: actions/checkout@v4

      - name: Build-fuggosegek
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git autoconf automake libtool libtool-bin \
            bison flex texinfo help2man gawk gperf pkg-config \
            libncurses-dev python3 unzip wget file curl rsync

      - name: Toolchain gyorsitotar
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: ~/x-tools
          key: koxtoolchain-${{ env.KOX_TARGET }}-v2

      - name: koxtoolchain epitese (ujraprobalkozassal)
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/Niluje/koxtoolchain ~/koxtc
          cd ~/koxtc
          ok=0
          for i in 1 2 3 4 5; do
            echo "=== koxtoolchain probalkozas #$i ==="
            if ./gen-tc.sh ${{ env.KOX_TARGET }}; then ok=1; break; fi
            echo "Sikertelen (valoszinuleg atmeneti letoltesi hiba). Ujra 30 mp mulva..."
            sleep 30
          done
          [ "$ok" = "1" ] || { echo "A toolchain 5 probalkozas utan sem epult meg."; exit 1; }

      - name: Forditó megkeresese (PATH + tuple)
        id: tuple
        run: |
          BINDIR="$(find "$HOME/x-tools" -maxdepth 2 -name bin -type d | head -n1)"
          echo "$BINDIR" >> "$GITHUB_PATH"
          TUPLE="$(basename "$(find "$BINDIR" -name '*-gcc' | head -n1)" | sed 's/-gcc$//')"
          echo "A forditó tuple: $TUPLE"
          echo "tuple=$TUPLE" >> "$GITHUB_OUTPUT"

      - name: NetSurf forditasa
        run: |
          chmod +x build.sh
          TARGET_TUPLE="${{ steps.tuple.outputs.tuple }}" JOBS="$(nproc)" ./build.sh

      - name: Eredmeny feltoltese
        uses: actions/upload-artifact@v4
        with:
          name: netsurf-kindle
          path: |
            out/netsurf
            out/res/**
          if-no-files-found: error
