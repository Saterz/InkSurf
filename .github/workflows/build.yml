name: NetSurf Kindle build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'build.sh', '.github/workflows/build.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/koreader/koxtoolchain:kindlehf-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hianyzo eszkozok
        shell: bash
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update || true
            apt-get install -y --no-install-recommends git file pkg-config python3 unzip wget curl rsync ca-certificates || true
          fi

      - name: Forditó megkeresese
        id: tc
        shell: bash
        run: |
          set -e
          GCC="$(find / -name '*kindlehf*-gcc' -type f 2>/dev/null | head -n1)"
          [ -n "$GCC" ] || GCC="$(find / -name 'arm-*-linux-gnueabihf-gcc' -type f 2>/dev/null | head -n1)"
          test -n "$GCC"
          echo "$(dirname "$GCC")" >> "$GITHUB_PATH"
          echo "tuple=$(basename "$GCC" | sed 's/-gcc$//')" >> "$GITHUB_OUTPUT"

      - name: NetSurf forditasa
        shell: bash
        run: |
          chmod +x build.sh
          TARGET_TUPLE="${{ steps.tc.outputs.tuple }}" JOBS="$(nproc)" ./build.sh

      - name: Eredmeny feltoltese
        uses: actions/upload-artifact@v4
        with:
          name: netsurf-kindle
          path: |
            out/netsurf
            out/res/**
          if-no-files-found: error
